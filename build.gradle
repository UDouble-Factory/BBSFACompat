plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "maven.modrinth:bbs-fs:${project.bbs_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        excludeTags 'resource-pack'
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def faPlayerPack = providers.gradleProperty('faPlayerPack').map { file(it) }
def requireFaPlayerPack = {
    if (!faPlayerPack.isPresent() || !faPlayerPack.get().isFile()) {
        throw new GradleException('This optional test requires -PfaPlayerPack=/absolute/path/to/FA-Player.zip')
    }
    faPlayerPack.get()
}

tasks.register('packTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'resource-pack'
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    inputs.file(faPlayerPack).withPropertyName('faPlayerPack').optional()
    doFirst {
        systemProperty 'bbsfacompat.testPack', requireFaPlayerPack().absolutePath
    }
}

sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def clientTestJar = tasks.register('clientTestJar', Jar) {
    archiveClassifier = 'client-test'
    destinationDirectory = layout.buildDirectory.dir('client-test-mod')
    from sourceSets.clientTest.output
}

loom {
    runs {
        clientTest {
            client()
            runDir 'build/client-test'
            vmArg "-Dfabric.addMods=${clientTestJar.get().archiveFile.get().asFile.absolutePath}"
        }
    }
}

tasks.named('runClientTest') {
    dependsOn clientTestJar
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    doFirst {
        def pack = requireFaPlayerPack()
        def testDir = file('build/client-test')
        testDir.mkdirs()
        new File(testDir, 'result.txt').text = 'PENDING\n'
        copy {
            from pack
            into new File(testDir, 'resourcepacks')
            rename { 'fa-player-test.zip' }
        }
        new File(testDir, 'options.txt').text = 'resourcePacks:["vanilla","fabric","file/fa-player-test.zip"]\nskipMultiplayerWarning:true\n'
    }
    doLast {
        def result = file('build/client-test/result.txt').text
        if (!result.startsWith('PASS:')) {
            throw new GradleException(result)
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "bbs_version", project.bbs_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "bbs_version": project.bbs_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
